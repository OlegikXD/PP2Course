<div style="background: {card_bg};
            border-radius: 16px; padding: 15px;
            border: 2px solid {border_color};
            transition: all 0.3s;
            box-shadow: {shadow};
            color: {text_color};">
    <div style="font-size: 14px; color: {text_secondary}; font-weight: 500;">
        {day_name}
    </div>
    <div style="font-size: 20px; font-weight: bold; margin: 2px 0;
                color: {text_color};">
        {date}
    </div>
    <div style="font-size: 48px; margin: 5px 0;">
        {emoji}
    </div>
    <div style="font-size: 28px; font-weight: bold; color: {text_color};">
        {temp}{unit}
    </div>
    <div style="font-size: 13px; color: {text_secondary}; margin: 3px 0;">
        {feels_like_text}. {feels_like}{unit}
    </div>
    <div style="font-size: 13px; color: {text_secondary}; margin-top: 5px;
                border-top: 1px solid {border_color};
                padding-top: 8px;">
        💧 {humidity}%
    </div>
    <div style="font-size: 12px; color: {text_secondary}; margin-top: 5px;">
        {description}
    </div>
</div>
